<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
    <link rel="alternate icon" href="/favicon.svg?v=3">
    <link rel="apple-touch-icon" href="/favicon.svg?v=3">
    <title>Super Admin Login — UrbanSync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .error {
            background: #fee;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            border-left: 4px solid #3c3;
        }

        .demo-creds {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 13px;
        }

        .demo-creds h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #333;
        }

        .demo-creds code {
            background: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>🏙️ Super Admin Portal</h1>
        <p class="subtitle">UrbanSync Municipal Command Center (Bokaro Steel City)<br>
            <span
                style="background: #10b981; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;">MUNICIPAL EXECUTIVE MODE</span>
        </p>

        <div id="message" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="cmo@bokaro.gov.in">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" required placeholder="Enter password">
                    <span id="togglePassword"
                        style="position: absolute; right: 10px; top: 10px; cursor: pointer; font-size: 1.2rem;">👁️</span>
                </div>
            </div>

            <button type="submit" id="loginBtn">Login</button>
        </form>
        <div class="demo-creds">
            <h3>Demonstration Credentials:</h3>
            <p><strong>Email:</strong> <code>cmo@bokaro.gov.in</code></p>
            <p><strong>Password:</strong> <code>SuperAdmin@2025</code></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const message = document.getElementById('message');

        // Pre-fill demo credentials
        emailInput.value = 'cmo@bokaro.gov.in';
        passwordInput.value = 'SuperAdmin@2025';

        // Click-to-fill demo credentials
        const demoCredsBox = document.querySelector('.demo-creds');
        if (demoCredsBox) {
            demoCredsBox.style.cursor = 'pointer';
            demoCredsBox.title = 'Click to auto-fill credentials';
            demoCredsBox.addEventListener('click', () => {
                emailInput.value = 'cmo@bokaro.gov.in';
                passwordInput.value = 'SuperAdmin@2025';
                showMessage('📋 Demo credentials filled! Click Login.', 'success');
            });
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const BACKEND_URL = window.location.hostname.includes('vercel.app') ? 'https://urbansync-backend-cqgj.onrender.com' : '';
                const response = await fetch(BACKEND_URL + '/api/super-admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    if (data.token) {
                        localStorage.setItem('urbansync_token', data.token);
                        localStorage.setItem('urbansync_superadmin_token', data.token);
                    }
                    showMessage('✅ Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/super-admin-dashboard.html';
                    }, 800);
                } else {
                    showMessage('❌ ' + (data.message || 'Invalid credentials'), 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            } catch (error) {
                console.error(error);
                showMessage('❌ Connection error. Please try again.', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });

        // Password Toggle
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });
    </script>
</body>

</html>
