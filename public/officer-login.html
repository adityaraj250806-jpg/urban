<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Zone Officer Login — UrbanSync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #11998e;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .error {
            background: #fee;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            border-left: 4px solid #3c3;
        }

        .demo-creds {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 13px;
        }

        .demo-creds h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #333;
        }

        .demo-creds code {
            background: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>👮 Zone Officer Login</h1>
        <p class="subtitle">UrbanSync Municipal Incident Triage (Bokaro Steel City)</p>

        <div id="message" class="message"></div>

        <form id="loginForm">
            <div style="margin-bottom: 20px; text-align: left;">
                <label style="font-size: 0.9rem; font-weight: bold; color: #4b5563;">⚡ Quick Login (Demo)</label>
                <select id="quickLogin" style="width: 100%; padding: 12px; margin-top: 5px; border: 2px solid #ddd; border-radius: 5px; font-size: 14px; outline: none; cursor: pointer; background: #f8fafc;">
                    <option value="">-- Select an account --</option>
                    <option value="officer1@bokaro.gov.in|Officer@123">Zonal Officer 1 (North/South Bokaro)</option>
                    <option value="officer2@bokaro.gov.in|Officer@123">Zonal Officer 2 (East/West Bokaro)</option>
                    <option value="officer3@bokaro.gov.in|Officer@123">Zonal Officer 3 (Central Bokaro)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="officer@bokaro.gov.in">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>

            <button type="submit" id="loginBtn">Login</button>
        </form>
    </div>

    <script>
        // Quick Login Logic
        document.getElementById('quickLogin').addEventListener('change', function(e) {
            if(this.value) {
                const [email, pass] = this.value.split('|');
                document.getElementById('email').value = email;
                document.getElementById('password').value = pass;
            } else {
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            }
        });

        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const message = document.getElementById('message');

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Check if it's a zone officer
                    if (data.admin.role === 'zone_officer') {
                        showMessage('✅ Login successful! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = '/officer-dashboard.html';
                        }, 1000);
                    } else {
                        showMessage('❌ Access denied. This portal is for zone officers only.', 'error');
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Login';
                    }
                } else {
                    showMessage('❌ ' + (data.message || 'Invalid credentials'), 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            } catch (error) {
                showMessage('❌ Connection error. Please try again.', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>
</body>

</html>
