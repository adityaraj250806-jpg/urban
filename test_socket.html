<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
    <link rel="alternate icon" href="/favicon.svg?v=3">
    <link rel="apple-touch-icon" href="/favicon.svg?v=3">
    <title>UrbanSync — Socket.io Connection Test</title>
</head>
<body>
    <h2>🏙️ UrbanSync Socket.io Test</h2>
    <p>Open browser console for detailed logs.</p>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Connects to the UrbanSync server hosting this file
        const socket = io(window.location.origin, {
            withCredentials: true,
            transports: ['websocket', 'polling']
        });
        
        socket.on('connect', () => {
            console.log('TEST_SOCKET_CONNECTED:', socket.id);
            document.body.innerHTML += '<div style="color:green">✅ Connected to UrbanSync WebSocket: ' + socket.id + '</div>';
        });
        
        socket.on('connect_error', (err) => {
            console.error('TEST_SOCKET_ERROR:', err.message);
            document.body.innerHTML += '<div style="color:red">❌ Error: ' + err.message + '</div>';
        });

        socket.on('newReport', (data) => {
            console.log('TEST_NEW_REPORT:', data);
            document.body.innerHTML += '<div style="color:green">📍 Received newReport event</div>';
        });

        socket.on('reportUpdated', (data) => {
            console.log('TEST_REPORT_UPDATED:', data);
            document.body.innerHTML += '<div style="color:blue">🔄 Received reportUpdated event</div>';
        });
    </script>
</body>
</html>
