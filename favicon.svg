<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Modern Tech / Municipal Sapphire-to-Cyan Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="blueArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
  </defs>

  <!-- Modern Blue Squircle Badge with crisp inset outline -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#7dd3fc" stroke-width="1.4" stroke-opacity="0.45" />

  <!-- Smart Municipal City Infrastructure -->
  <!-- Left Building -->
  <rect x="12" y="27" width="10" height="21" rx="1.5" fill="url(#bldgGrad)" />
  <rect x="14.5" y="30" width="2.5" height="3" rx="0.5" fill="#1e3a8a" />
  <rect x="18" y="30" width="2.5" height="3" rx="0.5" fill="#1e3a8a" />
  <rect x="14.5" y="35" width="2.5" height="3" rx="0.5" fill="#1e3a8a" />
  <rect x="18" y="35" width="2.5" height="3" rx="0.5" fill="#1e3a8a" />

  <!-- Center Main Municipal Tower -->
  <rect x="24" y="16" width="16" height="32" rx="2" fill="url(#bldgGrad)" />
  <!-- Center Tower Windows -->
  <rect x="27" y="20.5" width="3.5" height="3.5" rx="0.6" fill="#1e3a8a" />
  <rect x="33.5" y="20.5" width="3.5" height="3.5" rx="0.6" fill="#1e3a8a" />
  <rect x="27" y="26" width="3.5" height="3.5" rx="0.6" fill="#1e3a8a" />
  <rect x="33.5" y="26" width="3.5" height="3.5" rx="0.6" fill="#1e3a8a" />
  <rect x="27" y="31.5" width="3.5" height="3.5" rx="0.6" fill="#1e3a8a" />
  <rect x="33.5" y="31.5" width="3.5" height="3.5" rx="0.6" fill="#1e3a8a" />

  <!-- Center Antenna & Smart Sync Pulse Beacon -->
  <path d="M32 8 L32 16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="7.5" r="2.8" fill="#38bdf8" />
  <!-- Cyan signal wave pulses -->
  <path d="M25.5 8 C27.5 4.5, 36.5 4.5, 38.5 8" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.95" />

  <!-- Right Building -->
  <rect x="42" y="23" width="10" height="25" rx="1.5" fill="url(#bldgGrad)" />
  <rect x="44.5" y="26.5" width="2.5" height="3" rx="0.5" fill="#1e3a8a" />
  <rect x="48" y="26.5" width="2.5" height="3" rx="0.5" fill="#1e3a8a" />
  <rect x="44.5" y="31.5" width="2.5" height="3" rx="0.5" fill="#1e3a8a" />
  <rect x="48" y="31.5" width="2.5" height="3" rx="0.5" fill="#1e3a8a" />
  <rect x="44.5" y="36.5" width="2.5" height="3" rx="0.5" fill="#1e3a8a" />
  <rect x="48" y="36.5" width="2.5" height="3" rx="0.5" fill="#1e3a8a" />

  <!-- Dynamic Blue/Cyan Sweep Curve at base -->
  <path d="M6 48.5 C16 43, 33 42, 58 48 C48 56.5, 22 57.5, 6 48.5 Z" fill="url(#blueArcGrad)" />
  <!-- Curve rib highlight -->
  <path d="M12 49 C26 47, 40 47.5, 52 48.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.75" />
</svg>
