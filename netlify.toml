[build]
  publish = "public"
  command = "echo 'No build needed'"

[[redirects]]
  from = "/api/*"
  to = "https://greencredits-app.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://greencredits-app.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://greencredits-app.onrender.com/socket.io/:splat"
  status = 200
  force = true
